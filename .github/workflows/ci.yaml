name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch: {} # support manual runs
permissions:
  contents: read
jobs:
  ci:
    name: ci (go:${{ matrix.go-version.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - name: latest
            version: 1.27.x
          - name: previous
            version: 1.26.x
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version.version }}
      - name: Cache Tools
        uses: actions/cache@v6
        with:
          path: .tmp/bin
          # The Makefile rebuilds any tool whose version changed, so a cache
          # from an older Makefile or go.mod is safe to restore.
          key: tools-${{ runner.os }}-go${{ matrix.go-version.version }}-${{ hashFiles('Makefile', 'go.mod') }}
          restore-keys: tools-${{ runner.os }}-go${{ matrix.go-version.version }}-
      - name: Test
        run: make test
      - name: Lint
        # Often, lint & gofmt guidelines depend on the Go version. To prevent
        # conflicting guidance, run only on the most recent supported version.
        if: matrix.go-version.name == 'latest'
        run: make checkgenerate && make lint
